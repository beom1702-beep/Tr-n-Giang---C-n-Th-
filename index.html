    <script>
      // Fix for Chrome extensions / iframe inspectors setting window.fetch when only a getter exists
      (function() {
        try {
          var originalFetch = window.fetch;
          var _fetch = originalFetch ? originalFetch.bind(window) : null;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return _fetch;
            },
            set: function(newFetch) {
              _fetch = newFetch;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          // Fallback to data property if getter/setter fails
          try {
            var f = window.fetch;
            Object.defineProperty(window, 'fetch', {
              value: f,
              writable: true,
              configurable: true,
              enumerable: true
            });
          } catch (ignored) {}
        }
      })();
    </script>
